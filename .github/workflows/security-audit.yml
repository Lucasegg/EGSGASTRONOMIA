name: Auditoria de segurança

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    name: Verificações estáticas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verificar segredos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            -e 'ghp_[A-Za-z0-9]{30,}' \
            -e 'github_pat_[A-Za-z0-9_]{30,}' \
            -- . \
            ':!.github/workflows/security-audit.yml' \
            ':!SECURITY.md'; then
            echo 'Possível segredo encontrado no repositório.' >&2
            exit 1
          fi
          echo 'Nenhum padrão de segredo conhecido encontrado.'

      - name: Validar baseline CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          required = {
              "default-src": "'none'",
              "object-src": "'none'",
              "base-uri": "'none'",
              "form-action": "'none'",
              "frame-src": "'none'",
          }

          class CSPParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.csp = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  data = {k.lower(): v for k, v in attrs if k and v is not None}
                  if data.get('http-equiv', '').lower() == 'content-security-policy':
                      self.csp = data.get('content')

          problems = []
          for path in Path('.').glob('*.html'):
              parser = CSPParser()
              parser.feed(path.read_text(encoding='utf-8'))
              if not parser.csp:
                  problems.append(f'{path}: CSP ausente')
                  continue
              directives = {}
              for raw in parser.csp.split(';'):
                  parts = raw.strip().split()
                  if parts:
                      directives[parts[0].lower()] = set(parts[1:])
              for directive, value in required.items():
                  if value not in directives.get(directive, set()):
                      problems.append(f'{path}: {directive} sem {value}')
              tokens = {token for values in directives.values() for token in values}
              if "'unsafe-inline'" in tokens or "'unsafe-eval'" in tokens:
                  problems.append(f'{path}: CSP permite unsafe-inline/unsafe-eval')

          if problems:
              print('\n'.join(problems))
              raise SystemExit(1)
          print('Baseline CSP validado em todas as páginas HTML.')
          PY

      - name: Bloquear padrões HTML perigosos
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE \
            --include='*.html' \
            -e 'javascript:[[:space:]]*' \
            -e 'on(click|load|error|submit|mouseover|focus)[[:space:]]*=' \
            .; then
            echo 'Padrão HTML inseguro encontrado.' >&2
            exit 1
          fi
          echo 'Nenhum handler inline ou javascript: encontrado.'

      - name: Verificar links externos em nova aba
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          problems = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for tag in re.findall(r'<a\b[^>]*target=["\']_blank["\'][^>]*>', text, flags=re.I):
                  rel = re.search(r'rel=["\']([^"\']*)["\']', tag, flags=re.I)
                  values = set(rel.group(1).lower().split()) if rel else set()
                  if not {'noopener', 'noreferrer'}.issubset(values):
                      problems.append(f'{path}: {tag[:180]}')
          if problems:
              print('Links target=_blank sem noopener noreferrer:')
              print('\n'.join(problems))
              raise SystemExit(1)
          print('Links externos em nova aba estão protegidos.')
          PY

      - name: Validar formulários públicos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          problems = []
          for filename in ('index.html', 'fale-conosco.html'):
              text = Path(filename).read_text(encoding='utf-8')
              if 'class="honeypot"' not in text:
                  problems.append(f'{filename}: honeypot ausente')
              for field in ('nome', 'mensagem'):
                  tag = re.search(rf'<(?:input|textarea)\b[^>]*id=["\']{field}["\'][^>]*>', text, re.I)
                  if not tag or 'maxlength=' not in tag.group(0).lower():
                      problems.append(f'{filename}: limite de tamanho ausente em {field}')
          if problems:
              print('\n'.join(problems))
              raise SystemExit(1)
          print('Controles mínimos dos formulários públicos validados.')
          PY
